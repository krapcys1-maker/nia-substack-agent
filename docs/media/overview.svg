<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">NIA — your publication, your rules</title>
<desc id="desc">A reusable engine, portable editorial presets, and a private instance for your account. Research, evidence, writing, review, and publishing.</desc>
