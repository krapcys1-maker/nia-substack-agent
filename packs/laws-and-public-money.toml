# =============================================================================
# WSAD TEMATYCZNY — prawo i publiczne pieniadze
#
# UWAGA, ZANIM GO UZYJESZ. To jest jedyny wsad, przy ktorym kat redakcyjny
# robi cala robote. Bot komentujacy polityke po opinii jest bezuzyteczny
# i szkodliwy; bot czytajacy ustawe, przetarg i raport pokontrolny — nie jest.
# Dlatego `kat_redakcyjny` ponizej zada DOKUMENTU i wprost zabrania oceny
# intencji, a `dziedziny` sa o PROCEDURZE i PIENIADZACH, nie o ludziach.
#
# Ten bot ma bramke, ktora odrzuca liczby nieobecne w zebranym materiale,
# i karte dowodowa przy kazdym twierdzeniu. W tej dziedzinie to nie jest
# formalnosc — to jedyny powod, dla ktorego wolno ja w ogole tknac.
#
# Jak go uzyc:  python narzedzia/kreator.py --wsad laws-and-public-money
# =============================================================================

[pack]
name = "Laws and public money"
language = "English"
description = "Legislation, procurement, budgets and audit reports read as documents: what the text says, what it cost and who signed it — not who is right."
added = "2026-09-04"

[temat]
nisza = "how laws and public spending actually work, read from the documents"
jezyk = "English"
kat_redakcyjny = "what the document actually says, what the procedure actually requires, what the figure actually covers and who signed it. Never the motive, never the party, never a prediction about an election — where the record does not settle a question, the text says so and stops."

