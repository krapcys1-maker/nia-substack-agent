# =============================================================================
# WSAD TEMATYCZNY — sztuczna inteligencja i uczenie maszynowe
#
# Dziedzina, w ktorej najszybciej starzeje sie wiedza modelu: to, co model
# „wie" o modelach, ma kilka miesiecy i czyta sie od srodka dokladnie tak samo
# jak fakt biezacy. Dlatego przy tym wsadzie warto zostawic wlaczone pytanie
# o stan dziedziny (`stan_dziedziny.pytaj = true`) — bot raz na dobe pyta
# swiata, jak jest, zamiast pytac siebie.
#
# Jak go uzyc:  python narzedzia/kreator.py --wsad ai-and-machine-learning
# =============================================================================

[pack]
name = "AI and machine learning"
language = "English"
description = "Benchmarks, training data, inference economics, evaluation and the rules being written around all of it — the parts with a paper trail."
added = "2026-09-04"

[temat]
nisza = "how AI systems are built, measured and regulated"
jezyk = "English"
kat_redakcyjny = "what the benchmark actually measured, what the training data actually contained, what the licence actually permits, and who carries the cost when the answer is wrong."

