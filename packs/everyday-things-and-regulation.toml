# =============================================================================
# WSAD TEMATYCZNY — "how everyday things are made and regulated"
#
# To jest temat, na ktorym ten bot powstal i chodzil przez tygodnie na zywym
# koncie. Kazde haslo i kazda dziedzina byly uzywane naprawde, nie wymyslone
# do przykladu — dlatego ten wsad jest tez wzorcem tego, jak gesty ma byc
# material w pozostalych.
#
# Jak go uzyc:  python narzedzia/kreator.py --wsad everyday-things-and-regulation
# =============================================================================

[pack]
name = "Everyday things: how they are made and regulated"
language = "English"
description = "Standards, tolerances, certification, liability and procurement — the arrangements that decide what an object is allowed to be."
added = "2026-09-04"
source = "the configuration this bot ran on in production"

[temat]
nisza = "how everyday things are made and regulated"
jezyk = "English"
kat_redakcyjny = "what the record actually says, how the thing is built, who decides what it is allowed to do, and what that arrangement hands the people who built it."

